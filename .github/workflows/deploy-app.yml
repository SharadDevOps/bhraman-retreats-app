name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency: deploy-${{ inputs.environment || 'dev' }}

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      # Set Node 22 BEFORE installing pnpm (pnpm 11 needs Node >= 22.13). This is
      # the build runtime only; the app still runs on Node 20 on App Service.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Build
        run: pnpm build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          RG="rg-bhr-ret-${ENVIRONMENT}-cin"
          SERVER="psql-bhr-ret-${ENVIRONMENT}-cin"
          RULE="gh-deploy-temp"
          RUNNER_IP="$(curl -s https://api.ipify.org)"
          echo "Opening temporary firewall for runner IP $RUNNER_IP"
          # az CLI renamed these args in the 2026 breaking change: new CLI uses
          # --server-name (server) + --name (rule); older CLI uses --name (server)
          # + --rule-name (rule). Try new syntax, fall back to old.
          fw() {
            local action="$1"; shift
            az postgres flexible-server firewall-rule "$action" \
              --resource-group "$RG" --server-name "$SERVER" --name "$RULE" "$@" 2>/dev/null \
            || az postgres flexible-server firewall-rule "$action" \
              --resource-group "$RG" --name "$SERVER" --rule-name "$RULE" "$@"
          }
          fw create --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" >/dev/null
          trap 'fw delete --yes >/dev/null 2>&1 || true' EXIT
          pnpm prisma migrate deploy

      - name: Assemble standalone bundle
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          cp -r prisma .next/standalone/prisma
          # Next's standalone build already traces @prisma/client + the query
          # engine into the bundle. With pnpm the generated client lives in the
          # .pnpm store (node_modules/.prisma may not exist), so copy the real
          # generated client from wherever it is as extra insurance — non-fatal.
          GEN_DIR="$(find node_modules -type d -path '*/.prisma/client' -print -quit || true)"
          if [ -n "${GEN_DIR:-}" ]; then
            mkdir -p .next/standalone/node_modules/.prisma
            cp -rL "$GEN_DIR" .next/standalone/node_modules/.prisma/client
          fi
          PKG_DIR="$(find node_modules -type d -path '*/@prisma/client' -print -quit || true)"
          if [ -n "${PKG_DIR:-}" ]; then
            mkdir -p .next/standalone/node_modules/@prisma
            cp -rL "$PKG_DIR" .next/standalone/node_modules/@prisma/client
          fi

      - name: Deploy to Azure Web App
        run: |
          set -euo pipefail
          APP="app-bhr-ret-${ENVIRONMENT}-cin"
          RG="rg-bhr-ret-${ENVIRONMENT}-cin"
          # Next standalone reads HOSTNAME from the env; App Service sets it to the
          # container name, so the server must be told to bind 0.0.0.0 explicitly.
          az webapp config set --resource-group "$RG" --name "$APP" \
            --startup-file "HOSTNAME=0.0.0.0 node server.js" >/dev/null
          # Clear any leftover run-from-package setting from earlier attempts.
          az webapp config appsettings delete --resource-group "$RG" --name "$APP" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE >/dev/null 2>&1 || true
          cd .next/standalone
          zip -r ../../app.zip . >/dev/null
          cd ../..
          az webapp deploy \
            --resource-group "$RG" \
            --name "$APP" \
            --src-path app.zip --type zip
