name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency: deploy-${{ inputs.environment || 'dev' }}

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  ACR_NAME: acrbhrretcin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Build and push container image
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/bhraman-retreats:${GITHUB_SHA}"
          az acr login --name "$ACR_NAME"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          RG="rg-bhr-ret-${ENVIRONMENT}-cin"
          SERVER="psql-bhr-ret-${ENVIRONMENT}-cin"
          RULE="gh-deploy-temp"
          IP="$(curl -s https://api.ipify.org)"
          fw() {
            local action="$1"; shift
            az postgres flexible-server firewall-rule "$action" \
              --resource-group "$RG" --server-name "$SERVER" --name "$RULE" "$@" 2>/dev/null \
            || az postgres flexible-server firewall-rule "$action" \
              --resource-group "$RG" --name "$SERVER" --rule-name "$RULE" "$@"
          }
          fw create --start-ip-address "$IP" --end-ip-address "$IP" >/dev/null
          trap 'fw delete --yes >/dev/null 2>&1 || true' EXIT
          npx --yes prisma@6.19.3 migrate deploy

      - name: Point web app at the new image
        run: |
          set -euo pipefail
          RG="rg-bhr-ret-${ENVIRONMENT}-cin"
          APP="app-bhr-ret-${ENVIRONMENT}-cin"
          az webapp config container set --name "$APP" --resource-group "$RG" \
            --docker-custom-image-name "$IMAGE" \
            --docker-registry-server-url "https://${ACR_NAME}.azurecr.io"
          # Clear any leftover startup command; for a container it overrides the
          # image CMD and would run the wrong process.
          az webapp config set --name "$APP" --resource-group "$RG" --startup-file "" >/dev/null
          az webapp restart --name "$APP" --resource-group "$RG"
          echo "Deployed $IMAGE  ->  https://$APP.azurewebsites.net"
