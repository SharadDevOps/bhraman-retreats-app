name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency: deploy-${{ inputs.environment || 'dev' }}

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      # Set Node 22 BEFORE installing pnpm (pnpm 11 needs Node >= 22.13). This is
      # the build runtime only; the app still runs on Node 20 on App Service.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        # --config.node-linker=hoisted forces a flat node_modules (like npm) so
        # Next's runtime deps (styled-jsx, @swc/helpers) sit at the top level and
        # end up in the standalone bundle. Independent of .npmrc.
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Build
        run: pnpm build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          RG="rg-bhr-ret-${ENVIRONMENT}-cin"
          SERVER="psql-bhr-ret-${ENVIRONMENT}-cin"
          RULE="gh-deploy-temp"
          RUNNER_IP="$(curl -s https://api.ipify.org)"
          echo "Opening temporary firewall for runner IP $RUNNER_IP"
          # az CLI renamed these args in the 2026 breaking change: new CLI uses
          # --server-name (server) + --name (rule); older CLI uses --name (server)
          # + --rule-name (rule). Try new syntax, fall back to old.
          fw() {
            local action="$1"; shift
            az postgres flexible-server firewall-rule "$action" \
              --resource-group "$RG" --server-name "$SERVER" --name "$RULE" "$@" 2>/dev/null \
            || az postgres flexible-server firewall-rule "$action" \
              --resource-group "$RG" --name "$SERVER" --rule-name "$RULE" "$@"
          }
          fw create --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" >/dev/null
          trap 'fw delete --yes >/dev/null 2>&1 || true' EXIT
          pnpm prisma migrate deploy

      - name: Assemble standalone bundle
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          cp -r prisma .next/standalone/prisma
          # Keep the SLIM traced standalone node_modules (fast to extract / boot).
          # Next's tracer drops several of Next's OWN dependencies under pnpm
          # (styled-jsx, @swc/helpers, @next/env, ...). Copy Next's entire
          # dependency set in one shot: in pnpm they all sit together in Next's
          # own .pnpm folder as (symlinked) siblings.
          copy_dep () {
            dep="$1"
            [ -f "$dep/package.json" ] || return 0
            name="$(node -e "process.stdout.write(require('$dep/package.json').name)" 2>/dev/null || true)"
            [ -n "$name" ] || return 0
            dest=".next/standalone/node_modules/$name"
            [ -e "$dest" ] && return 0
            mkdir -p "$(dirname "$dest")"
            cp -aL "$dep" "$dest"
            echo "bundled $name"
          }
          NEXT_NM="$(ls -d node_modules/.pnpm/next@*/node_modules 2>/dev/null | head -1 || true)"
          if [ -z "$NEXT_NM" ]; then
            echo "ERROR: cannot locate next in .pnpm store:"; ls node_modules/.pnpm 2>/dev/null | head -50; exit 1
          fi
          for d in "$NEXT_NM"/*; do
            case "$(basename "$d")" in
              @*) for s in "$d"/*; do copy_dep "$s"; done ;;
              *)  copy_dep "$d" ;;
            esac
          done
          # Fail now (not at runtime) if anything critical is missing.
          for m in next styled-jsx @swc/helpers @next/env react @prisma/client; do
            if [ ! -f ".next/standalone/node_modules/$m/package.json" ]; then
              echo "ERROR: missing node_modules/$m in bundle"; exit 1
            fi
          done
          echo "Bundle node_modules verified."

      - name: Deploy to Azure Web App
        run: |
          set -euo pipefail
          APP="app-bhr-ret-${ENVIRONMENT}-cin"
          RG="rg-bhr-ret-${ENVIRONMENT}-cin"
          # Next standalone reads HOSTNAME from the env; App Service sets it to the
          # container name, so the server must be told to bind 0.0.0.0 explicitly.
          az webapp config set --resource-group "$RG" --name "$APP" \
            --startup-file "HOSTNAME=0.0.0.0 node server.js" >/dev/null
          # Clear any leftover run-from-package setting from earlier attempts.
          az webapp config appsettings delete --resource-group "$RG" --name "$APP" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE >/dev/null 2>&1 || true
          cd .next/standalone
          zip -r ../../app.zip . >/dev/null
          cd ../..
          az webapp deploy \
            --resource-group "$RG" \
            --name "$APP" \
            --src-path app.zip --type zip
