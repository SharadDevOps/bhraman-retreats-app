name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency: deploy-${{ inputs.environment || 'dev' }}

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  ACR_NAME: acrbhrretcin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Build and push container image
        run: |
          set -euo pipefail
          REPO="${ACR_NAME}.azurecr.io/bhraman-retreats"
          az acr login --name "$ACR_NAME"
          # Terraform pins the app to :latest, so push both a traceable SHA tag
          # and :latest, then restart to pull the new :latest.
          docker build -t "$REPO:${GITHUB_SHA}" -t "$REPO:latest" .
          docker push "$REPO:${GITHUB_SHA}"
          docker push "$REPO:latest"

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          RG="rg-bhr-ret-${ENVIRONMENT}-cin"
          SERVER="psql-bhr-ret-${ENVIRONMENT}-cin"
          RULE="gh-deploy-temp"
          IP="$(curl -s https://api.ipify.org)"
          fw() {
            local action="$1"; shift
            az postgres flexible-server firewall-rule "$action" \
              --resource-group "$RG" --server-name "$SERVER" --name "$RULE" "$@" 2>/dev/null \
            || az postgres flexible-server firewall-rule "$action" \
              --resource-group "$RG" --name "$SERVER" --rule-name "$RULE" "$@"
          }
          fw create --start-ip-address "$IP" --end-ip-address "$IP" >/dev/null
          trap 'fw delete --yes >/dev/null 2>&1 || true' EXIT
          npx --yes prisma@6.19.3 migrate deploy

      - name: Restart web app to pull the new image
        run: |
          set -euo pipefail
          RG="rg-bhr-ret-${ENVIRONMENT}-cin"
          APP="app-bhr-ret-${ENVIRONMENT}-cin"
          # Image reference + registry + settings are managed by Terraform; just
          # restart so App Service re-pulls :latest.
          az webapp restart --name "$APP" --resource-group "$RG"
          echo "Deployed ${ACR_NAME}.azurecr.io/bhraman-retreats:latest  ->  https://$APP.azurewebsites.net"
